<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell admin-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Researcher Access</p>
          <h1>Admin Export Dashboard</h1>
        </div>
        <a class="admin-link" href="./">Back to experiment</a>
      </header>

      <main class="admin-layout">
        <section class="surface admin-login">
          <div class="section-heading">
            <h2>Log in</h2>
          </div>
          <p class="muted">
            This is only for the researchers of this experiment. If you are not a researcher of this experiment, please click on "Back to experiment".
          </p>
          <form id="admin-login-form" class="stack">
            <label class="field">
              <span>Email</span>
              <input id="admin-email" type="email" autocomplete="username" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                id="admin-password"
                type="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button class="button primary" type="submit">Log in</button>
          </form>
          <p class="inline-status" id="admin-auth-status"></p>
        </section>

        <section class="surface admin-dashboard hidden" id="admin-dashboard">
          <div class="admin-toolbar">
            <div class="section-heading">
              <h2>Participants' data</h2>
            </div>
            <div class="toolbar-actions">
              <button class="button ghost" id="refresh-admin" type="button">Refresh</button>
              <button class="button ghost" id="signout-admin" type="button">Log out</button>
            </div>
          </div>

          <div class="metric-grid" id="admin-metrics"></div>

          <div class="toolbar-actions export-actions">
            <button class="button secondary" id="export-summary" type="button">
              Download CSV
            </button>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Participant</th>
                  <th>Condition</th>
                  <th>Difficulty</th>
                  <th>Stage</th>
                  <th>AI Checks</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody id="participants-table-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="./__env.js"></script>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
